<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<meta name="description" content="Uwian — find your crew, join a session, get home safe.">
<title>Uwian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 17 16 7l10 10v9a2 2 0 0 1-2 2h-5v-7h-4v7H8a2 2 0 0 1-2-2z' fill='%23F59332'/%3E%3C/svg%3E">
</head>
<body>
<div class="noise" aria-hidden="true"></div>

<header class="masthead">
  <button class="logo-btn" data-link="/" aria-label="Uwian home">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 3h6"/><path d="M12 3v3"/><circle cx="12" cy="11" r="2.2"/><path d="M6 10a6 6 0 0 1 12 0v7a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M9 19v2h6v-2"/>
    </svg>
  </button>
  <span class="wordmark">uwian</span>
  <span class="tagline">find your crew, get home safe</span>
  <nav id="topnav" class="topnav" aria-label="Main"></nav>
  <button id="bell" class="bell-btn" aria-label="Notifications">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 7h16c0-2-2-3-2-7a6 6 0 0 0-6-6zm-2 16a2 2 0 0 0 4 0"/>
    </svg>
    <span id="bell-count" class="bell-dot" hidden aria-live="polite"></span>
  </button>
</header>

<main id="view" tabindex="-1" aria-label="Page content"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>

<script src="/vendor/leaflet.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
