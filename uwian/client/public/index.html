<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241b12">
<title>Uwian — pauwi tayo ng maayos</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 17 16 7l10 10v9a2 2 0 0 1-2 2h-5v-7h-4v7H8a2 2 0 0 1-2-2z' fill='%23d8a24a'/%3E%3C/svg%3E">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <button class="house-knob" data-link="/" aria-label="Uwian — home">

      <path d="M6 17 16 7l10 10v9a2 2 0 0 1-2 2h-5v-7h-4v7H8a2 2 0 0 1-2-2z"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
    </svg>
  </button>
  <span class="wordmark">uwian</span>
  <span class="tagline">pauwi tayo ng maayos</span>
  <nav id="topnav" class="topnav"></nav>
  <button id="bell" class="brass-bell" aria-label="Mensahe">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 7h16c0-2-2-3-2-7a6 6 0 0 0-6-6zm-2 16a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span id="bell-count" class="bell-dot" hidden></span>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>

<script src="/vendor/leaflet.js"></script>
<script type="module" src="/js/app.js"></script>

</html>
